name: Build macOS PKG Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    # macos-26 standard runners use Apple silicon (arm64).
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "\${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="\${GITHUB_REF_NAME}"
            VERSION="\${TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the format vMAJOR.MINOR.PATCH."
              exit 1
            fi
          else
            VERSION="1.0.\${GITHUB_RUN_NUMBER}"
            TAG="v$VERSION"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          # Two compiler jobs keep peak memory low on the 7 GB standard Apple silicon runner.
          swift build -c release --arch arm64 --jobs 2
          BIN_DIR="$(swift build --show-bin-path -c release --arch arm64)"
          SNOTE_BINARY="$BIN_DIR/SNote"

          if [[ ! -x "$SNOTE_BINARY" ]]; then
            echo "::error::Could not find the release executable at $SNOTE_BINARY."
            exit 1
          fi

          ARCHS="$(lipo -archs "$SNOTE_BINARY")"
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "::error::Expected an ARM64-only executable, found: $ARCHS"
            exit 1
          fi

          echo "SNOTE_BINARY=$SNOTE_BINARY" >> "$GITHUB_ENV"

      - name: Package, sign, and notarize installer
        env:
          BUILD_CERTIFICATE_BASE64: \${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: \${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: \${{ secrets.P12_PASSWORD }}
          INSTALLER_P12_PASSWORD: \${{ secrets.INSTALLER_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: \${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARIZATION_APPLE_ID: \${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: \${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: \${{ secrets.NOTARIZATION_TEAM_ID }}
          VERSION: \${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="dist/SNote.app"
          CONTENTS="$APP_DIR/Contents"
          BUNDLE_ID="com.sinamombeiny.snote"
          PKG_PATH="dist/SNote-macOS.pkg"
          mkdir -p "$CONTENTS/MacOS" dist
          cp "$SNOTE_BINARY" "$CONTENTS/MacOS/SNote"

          ARCHS="$(lipo -archs "$CONTENTS/MacOS/SNote")"
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "::error::Expected an ARM64-only app executable, found: $ARCHS"
            exit 1
          fi

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>SNote</string>
              <key>CFBundleDisplayName</key>
              <string>SNote</string>
              <key>CFBundleIdentifier</key>
              <string>com.sinamombeiny.snote</string>
              <key>CFBundleExecutable</key>
              <string>SNote</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>VERSION_PLACEHOLDER</string>
              <key>CFBundleVersion</key>
              <string>VERSION_PLACEHOLDER</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.productivity</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$CONTENTS/Info.plist" >/dev/null

          SIGNING_CONFIGURED=false
          for secret_name in BUILD_CERTIFICATE_BASE64 INSTALLER_CERTIFICATE_BASE64 P12_PASSWORD INSTALLER_P12_PASSWORD KEYCHAIN_PASSWORD NOTARIZATION_APPLE_ID NOTARIZATION_PASSWORD NOTARIZATION_TEAM_ID; do
            if [[ -n "\${!secret_name:-}" ]]; then
              SIGNING_CONFIGURED=true
              break
            fi
          done

          if [[ "$SIGNING_CONFIGURED" == "true" ]]; then
            for secret_name in BUILD_CERTIFICATE_BASE64 INSTALLER_CERTIFICATE_BASE64 P12_PASSWORD INSTALLER_P12_PASSWORD KEYCHAIN_PASSWORD NOTARIZATION_APPLE_ID NOTARIZATION_PASSWORD NOTARIZATION_TEAM_ID; do
              if [[ -z "\${!secret_name:-}" ]]; then
                echo "::error::Set $secret_name. Signed and notarized PKG releases require both Developer ID Application and Developer ID Installer certificates plus the notarization secrets."
                exit 1
              fi
            done

            KEYCHAIN_PATH="$RUNNER_TEMP/snote-build.keychain-db"
            APP_CERTIFICATE_PATH="$RUNNER_TEMP/snote-app-certificate.p12"
            INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/snote-installer-certificate.p12"
            ORIGINAL_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
            cleanup() {
              security default-keychain -d user -s "$ORIGINAL_KEYCHAIN" || true
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
              rm -f "$APP_CERTIFICATE_PATH" "$INSTALLER_CERTIFICATE_PATH"
            }
            trap cleanup EXIT

            echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$APP_CERTIFICATE_PATH"
            echo "$INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$INSTALLER_CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$APP_CERTIFICATE_PATH" \
              -k "$KEYCHAIN_PATH" \
              -P "$P12_PASSWORD" \
              -T /usr/bin/codesign
            security import "$INSTALLER_CERTIFICATE_PATH" \
              -k "$KEYCHAIN_PATH" \
              -P "$INSTALLER_P12_PASSWORD" \
              -T /usr/bin/pkgbuild
            security default-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign:,productbuild: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            APP_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Developer ID Application/{print $2; exit}')"
            INSTALLER_SIGNING_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" \
              | awk '/Developer ID Installer/{print $2; exit}')"
            if [[ -z "$APP_SIGNING_IDENTITY" || -z "$INSTALLER_SIGNING_IDENTITY" ]]; then
              echo "::error::The certificates must be Developer ID Application and Developer ID Installer certificates."
              exit 1
            fi

            codesign --force --timestamp --options runtime \
              --sign "$APP_SIGNING_IDENTITY" "$APP_DIR"
            codesign --verify --strict --verbose=2 "$APP_DIR"

            pkgbuild \
              --component "$APP_DIR" \
              --install-location /Applications \
              --identifier "$BUNDLE_ID" \
              --version "$VERSION" \
              --sign "$INSTALLER_SIGNING_IDENTITY" \
              "$PKG_PATH"

            xcrun notarytool store-credentials "SNote-notary" \
              --apple-id "$NOTARIZATION_APPLE_ID" \
              --password "$NOTARIZATION_PASSWORD" \
              --team-id "$NOTARIZATION_TEAM_ID"
            xcrun notarytool submit "$PKG_PATH" \
              --keychain-profile "SNote-notary" \
              --wait
            xcrun stapler staple "$PKG_PATH"
            pkgutil --check-signature "$PKG_PATH"
          else
            codesign --force --sign - "$APP_DIR"
            codesign --verify --strict --verbose=2 "$APP_DIR"
            pkgbuild \
              --component "$APP_DIR" \
              --install-location /Applications \
              --identifier "$BUNDLE_ID" \
              --version "$VERSION" \
              "$PKG_PATH"
            echo "::warning::No signing secrets were provided. This PKG is unsigned and is not notarized; macOS may block installation until the user explicitly allows it."
          fi

          test -s "$PKG_PATH"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SNote-macOS-arm64
          path: dist/SNote-macOS.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: \${{ github.token }}
          TAG: \${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Remove only the legacy assets generated by this workflow when replacing an existing release.
            for legacy_asset in SNote-macOS.dmg SNote-macOS.zip; do
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[].name" | grep -Fxq "$legacy_asset"; then
                gh release delete-asset "$TAG" "$legacy_asset" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              fi
            done

            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$PKG_PATH"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SNote $TAG" \
              --notes "Apple silicon (ARM64) macOS installer package. Install SNote in /Applications." \
              "$PKG_PATH"
          fi
