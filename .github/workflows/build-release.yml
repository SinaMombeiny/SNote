name: Build macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    # GitHub's macos-26 standard runner is Apple silicon (arm64).
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the format vMAJOR.MINOR.PATCH."
              exit 1
            fi
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            TAG="v$VERSION"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          swift build -c release --arch arm64
          BIN_DIR="$(swift build --show-bin-path -c release --arch arm64)"
          SNOTE_BINARY="$BIN_DIR/SNote"

          if [[ ! -x "$SNOTE_BINARY" ]]; then
            echo "::error::Could not find the release executable at $SNOTE_BINARY."
            exit 1
          fi

          ARCHS="$(lipo -archs "$SNOTE_BINARY")"
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "::error::Expected an ARM64-only executable, found: $ARCHS"
            exit 1
          fi

          echo "SNOTE_BINARY=$SNOTE_BINARY" >> "$GITHUB_ENV"

      - name: Package, sign, and notarize application
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="dist/SNote.app"
          CONTENTS="$APP_DIR/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources" dist
          cp "$SNOTE_BINARY" "$CONTENTS/MacOS/SNote"

          ARCHS="$(lipo -archs "$CONTENTS/MacOS/SNote")"
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "::error::Expected an ARM64-only app executable, found: $ARCHS"
            exit 1
          fi

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>SNote</string>
              <key>CFBundleDisplayName</key>
              <string>SNote</string>
              <key>CFBundleIdentifier</key>
              <string>com.sinamombeiny.snote</string>
              <key>CFBundleExecutable</key>
              <string>SNote</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>VERSION_PLACEHOLDER</string>
              <key>CFBundleVersion</key>
              <string>VERSION_PLACEHOLDER</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.productivity</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$CONTENTS/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$CONTENTS/Info.plist" >/dev/null

          if [[ -n "${BUILD_CERTIFICATE_BASE64:-}" ]]; then
            for secret_name in P12_PASSWORD KEYCHAIN_PASSWORD NOTARIZATION_APPLE_ID NOTARIZATION_PASSWORD NOTARIZATION_TEAM_ID; do
              if [[ -z "${!secret_name:-}" ]]; then
                echo "::error::Set $secret_name when using Developer ID signing."
                exit 1
              fi
            done

            KEYCHAIN_PATH="$RUNNER_TEMP/snote-build.keychain-db"
            CERTIFICATE_PATH="$RUNNER_TEMP/snote-certificate.p12"
            ORIGINAL_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
            cleanup() {
              security default-keychain -d user -s "$ORIGINAL_KEYCHAIN" || true
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
              rm -f "$CERTIFICATE_PATH"
            }
            trap cleanup EXIT

            echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" \
              -k "$KEYCHAIN_PATH" \
              -P "$P12_PASSWORD" \
              -T /usr/bin/codesign
            security default-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Developer ID Application/{print $2; exit}')"
            if [[ -z "$SIGNING_IDENTITY" ]]; then
              echo "::error::The certificate must be a Developer ID Application certificate."
              exit 1
            fi

            codesign --force --timestamp --options runtime \
              --sign "$SIGNING_IDENTITY" "$APP_DIR"
            codesign --verify --strict --verbose=2 "$APP_DIR"

            NOTARIZATION_ARCHIVE="$RUNNER_TEMP/SNote-notarization.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$NOTARIZATION_ARCHIVE"
            xcrun notarytool store-credentials "SNote-notary" \
              --apple-id "$NOTARIZATION_APPLE_ID" \
              --password "$NOTARIZATION_PASSWORD" \
              --team-id "$NOTARIZATION_TEAM_ID"
            xcrun notarytool submit "$NOTARIZATION_ARCHIVE" \
              --keychain-profile "SNote-notary" \
              --wait
            xcrun stapler staple "$APP_DIR"
            rm -f "$NOTARIZATION_ARCHIVE"
          else
            codesign --force --sign - "$APP_DIR"
            codesign --verify --strict --verbose=2 "$APP_DIR"
            echo "::warning::No Developer ID certificate was provided; this build is ad-hoc signed and will not be notarized."
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/SNote-macOS.zip"
          hdiutil create -volname "SNote" -srcfolder "$APP_DIR" \
            -ov -format UDZO "dist/SNote-macOS.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SNote-macOS-arm64
          path: |
            dist/SNote-macOS.zip
            dist/SNote-macOS.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/SNote-macOS.zip \
              dist/SNote-macOS.dmg
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SNote $TAG" \
              --notes "Apple silicon (ARM64) macOS app built with SwiftUI and C++23. Download the ZIP or DMG." \
              dist/SNote-macOS.zip \
              dist/SNote-macOS.dmg
          fi
