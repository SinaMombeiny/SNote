name: Build macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package application
        run: |
          set -euo pipefail

          APP_DIR="dist/HelloCppSwift.app"
          CONTENTS="$APP_DIR/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

          cp ".build/release/HelloApp" "$CONTENTS/MacOS/HelloCppSwift"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>HelloCppSwift</string>
              <key>CFBundleDisplayName</key>
              <string>HelloCppSwift</string>
              <key>CFBundleIdentifier</key>
              <string>com.sinamombeiny.hellocppswift</string>
              <key>CFBundleExecutable</key>
              <string>HelloCppSwift</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$CONTENTS/Info.plist" >/dev/null
          codesign --force --deep --sign - "$APP_DIR"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/HelloCppSwift-macOS.zip"
          hdiutil create -volname "HelloCppSwift" -srcfolder "$APP_DIR" -ov -format UDZO "dist/HelloCppSwift-macOS.dmg"

      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "HelloCppSwift $TAG" \
            --notes "macOS app built with SwiftUI and C++. Download the ZIP or DMG, then open the app." \
            dist/HelloCppSwift-macOS.zip \
            dist/HelloCppSwift-macOS.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HelloCppSwift-macOS
          path: dist/
