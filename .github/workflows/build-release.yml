name: Build macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          swift build -c release --arch arm64

          HELLO_BINARY=$(find .build -type f -path "*release*/HelloApp" -perm -111 | head -n 1)
          if [[ -z "$HELLO_BINARY" ]]; then
            echo "::error::Could not find the ARM64 HelloApp executable."
            exit 1
          fi

          ARCHS=$(lipo -archs "$HELLO_BINARY")
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "::error::The application contains non-ARM64 architecture slices: $ARCHS"
            exit 1
          fi

          echo "HELLO_BINARY=$HELLO_BINARY" >> "$GITHUB_ENV"

      - name: Package application
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          set -euo pipefail

          APP_DIR="dist/SNote.app"
          CONTENTS="$APP_DIR/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

          cp "$HELLO_BINARY" "$CONTENTS/MacOS/SNote"
          if [[ "$(lipo -archs "$CONTENTS/MacOS/SNote")" != "arm64" ]]; then
            echo "::error::The packaged app is not ARM64-only."
            exit 1
          fi

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>SNote</string>
              <key>CFBundleDisplayName</key>
              <string>SNote</string>
              <key>CFBundleIdentifier</key>
              <string>com.sinamombeiny.snote</string>
              <key>CFBundleExecutable</key>
              <string>SNote</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$CONTENTS/Info.plist" >/dev/null

          if [[ -n "${BUILD_CERTIFICATE_BASE64:-}" ]]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

            security create-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" build.keychain
            security import certificate.p12 \
              -k build.keychain \
              -P "${P12_PASSWORD:-}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "${KEYCHAIN_PASSWORD:-temporary}" build.keychain

            SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain \
              | awk '/Developer ID Application/{print $2; exit}')
            if [[ -z "$SIGNING_IDENTITY" ]]; then
              echo "::error::The certificate is not a Developer ID Application certificate."
              exit 1
            fi

            codesign --force --deep --timestamp --options runtime \
              --sign "$SIGNING_IDENTITY" "$APP_DIR"
          else
            codesign --force --deep --sign - "$APP_DIR"
          fi

          if [[ -n "${NOTARIZATION_APPLE_ID:-}" && \
                -n "${NOTARIZATION_PASSWORD:-}" && \
                -n "${NOTARIZATION_TEAM_ID:-}" && \
                -n "${BUILD_CERTIFICATE_BASE64:-}" ]]; then
            xcrun notarytool store-credentials "SNote-notary" \
              --apple-id "$NOTARIZATION_APPLE_ID" \
              --password "$NOTARIZATION_PASSWORD" \
              --team-id "$NOTARIZATION_TEAM_ID"

            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/SNote-notarization.zip"
            xcrun notarytool submit "dist/SNote-notarization.zip" \
              --keychain-profile "SNote-notary" \
              --wait
            xcrun stapler staple "$APP_DIR"
            rm "dist/SNote-notarization.zip"
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/SNote-macOS.zip"
          hdiutil create -volname "SNote" -srcfolder "$APP_DIR" -ov -format UDZO "dist/SNote-macOS.dmg"

      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SNote $TAG" \
            --notes "Native Apple silicon notes app built with SwiftUI and C++. Download the ZIP or DMG, then open the app." \
            dist/SNote-macOS.zip \
            dist/SNote-macOS.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SNote-macOS
          path: dist/
